<h2 mat-dialog-title>Nouvelle tâche</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
    <mat-dialog-content>
        <p class="dialog-intro">Organise ta prochaine action.</p>
            <mat-form-field appearance="outline">
                <mat-label>Titre</mat-label>
                <input matInput id="title" formControlName="title">
                @if (form.controls.title.hasError('duplicate')) {
                    <mat-error>Une tâche avec ce titre existe déjà.</mat-error>
                } @else if (form.controls.title.touched && form.controls.title.invalid) {
                    <mat-error>Le titre doit contenir au moins 3 caractères.</mat-error>
                }
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Description</mat-label>
                <textarea
                    matInput
                    id="description"
                    formControlName="description"
                    rows="3"
                ></textarea>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Échéance</mat-label>
                <input
                    matInput
                    [matDatepicker]="dueDatePicker"
                    formControlName="dueDate"
                    id="due"
                >
                <mat-datepicker-toggle matIconSuffix [for]="dueDatePicker" />
                <mat-datepicker #dueDatePicker />
            </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button type="button" mat-dialog-close>Annuler</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
            Ajouter la tâche
        </button>
    </mat-dialog-actions>
</form>
