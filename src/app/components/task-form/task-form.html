<h1>Nouvelle tâche</h1>
<form [formGroup]="form" (ngSubmit)="submit()">
    <label for="title">Titre</label>
    <input id="title" formControlName="title" aria-describedby="title-error" [attr.aria-invalid]="form.controls.title.invalid
      && form.controls.title.touched">
    <p id="title-error" aria-live="polite">
        @if (form.controls.title.touched
        && form.controls.title.invalid) {
        Le titre doit contenir au moins 3 caractères.
        }
    </p>

    <label for="description">Description facultative</label>
    <textarea id="description" formControlName="description"></textarea>
    <br>
    <br>
    <mat-form-field appearance="outline">
        <mat-label>Échéance facultative</mat-label>
        <input
            matInput
            [matDatepicker]="dueDatePicker"
            formControlName="dueDate"
            id="due"
        >
        <mat-datepicker-toggle
            matIconSuffix
            [for]="dueDatePicker"
        />
        <mat-datepicker #dueDatePicker />
    </mat-form-field>

    <button type="submit" [disabled]="form.invalid">
        Ajouter
    </button>
</form>
